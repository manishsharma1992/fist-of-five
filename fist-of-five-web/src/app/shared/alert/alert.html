@if(show) {
<div
  [ngClass]="{
    'alert alert-success': type() === 'success',
    'alert alert-danger': type() === 'error',
    'alert alert-warning': type() === 'warning',
    'alert alert-info': type() === 'info'
  }"
  role="alert"
>
  {{ message() }}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" (click)="close()"></button>
</div>
}
