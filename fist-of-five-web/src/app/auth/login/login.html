<div class="login-container">
  <div class="background">
    <app-waves></app-waves>
  </div>
  <div class="login fade-in">
    <app-logo class="logo"></app-logo>
    <h2 i18n="@@appTagline">Réunions agiles, simplifiées</h2>
    <h3 i18n="@@appSubTagLine">Des outils spécialement conçus pour les équipes productives.</h3>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <mat-form-field class="form-field" appearance="outline">
        <input
          appForbiddenUsername
          matInput
          formControlName="username"
          type="text"
          placeholder="Enter UID"
        />
        <mat-label>UID</mat-label>
        <!-- @if(loginForm.get('username')?.errors?.['usernameFormat']) {
          <mat-error>
            Username must be one lowercase letter followed by 5 digits (e.g., h23875).
          </mat-error>
        } -->
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label i18n="@@passwordLabel" class="text-capitalize">mot de passe</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          placeholder="veuillez entrer le mot de passe"
          i18n-placeholder="@@passwordPlaceholderText"
        />
      </mat-form-field>
      <button matButton type="submit">Login</button>
      <a i18n="@@forgotPasswordLabel">Mot de passe oublié ?</a>
      <p class="footer" i18n="@@loginCreateAccountLabel">Vous n'êtes pas encore membre ? <a [routerLink]="['/auth/', 'register']">Créer un compte</a></p>
    </form>
  </div>
</div>
