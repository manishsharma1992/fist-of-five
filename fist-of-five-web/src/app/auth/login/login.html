<div class="login-container">
  <div class="background">
    <svg
      version="1.1"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      x="0px"
      y="0px"
      width="100%"
      height="100%"
      viewBox="0 0 1600 900"
    >
      <defs>
        <path
          id="wave"
          fill="rgba(21,80,54,0.60)"
          d="M-363.852,502.589c0,0,236.988-41.997,505.475,0
      s371.981,38.998,575.971,0s293.985-39.278,505.474,5.859s493.475,48.368,716.963-4.995v560.106H-363.852V502.589z"
        />
      </defs>
      <g>
        <use xlink:href="#wave" opacity=".4">
          <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="translate"
            dur="8s"
            calcMode="spline"
            values="270 230; -334 180; 270 230"
            keyTimes="0; .5; 1"
            keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
            repeatCount="indefinite"
          />
        </use>
        <use xlink:href="#wave" opacity=".6">
          <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="translate"
            dur="6s"
            calcMode="spline"
            values="-270 230;243 220;-270 230"
            keyTimes="0; .6; 1"
            keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
            repeatCount="indefinite"
          />
        </use>
        <use xlink:href="#wave" opacity=".9">
          <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="translate"
            dur="4s"
            calcMode="spline"
            values="0 230;-140 200;0 230"
            keyTimes="0; .4; 1"
            keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
            repeatCount="indefinite"
          />
        </use>
      </g>
    </svg>
  </div>
  <div class="login">
    <img src="/images/logo-bnp.svg" alt="BNP Paribas logo"/>
    <h2>Welcome to Planning Poker</h2>
    <h3>Lightning quick story estimation!</h3>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <mat-form-field class="form-field" appearance="outline">
        <input
          appForbiddenUsername
          matInput
          formControlName="username"
          type="text"
          placeholder="Enter UID"
        />
        <mat-label>UID</mat-label>
        <!-- @if(loginForm.get('username')?.errors?.['usernameFormat']) {
          <mat-error>
            Username must be one lowercase letter followed by 5 digits (e.g., h23875).
          </mat-error>
        } -->
      </mat-form-field>
      <mat-form-field appearance="outline">
        <input
          matInput
          formControlName="password"
          type="password"
          placeholder="Enter password"
        />
        <mat-label>Password</mat-label>
      </mat-form-field>
      <button matButton type="submit">Login</button>
      <a>Forgot password?</a>
      <p class="footer">Not a member yet? <a>Sign up!</a></p>
    </form>
  </div>
</div>
