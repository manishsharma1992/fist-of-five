<div class="main-bg">
    <div class="login-container">
        <div class="left-container">
            <div id="carouselExampleIndicators" class="carousel slide position-relative" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>

                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="assets/images/login-pic-4.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block">
                            <h6>Playing with Statuses</h6>
                            <p class="white-12-400">This issue is now 'on hold' until I find my coffee.</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="assets/images/login-pic-2.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block">
                            <h6>General Frustations</h6>
                            <p class="white-12-400">This ticket is now in the state of 'epic' proportions</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="assets/images/login-pic-3.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block">
                            <h6>When things go wrong</h6>
                            <p class="white-12-400">This is not a bug, it's a feature... we didn't ask for.</p>
                        </div>
                    </div>
                </div>

                <!-- COMMON BUTTON (Positioned Top Left) -->
                <div class="common-overlay">
                    <img src="assets/logo/fof-logo.png" class="logo" alt="Logo">
                    <!-- <button class="btn btn-primary">
                        Back to wesbite
                        <i class="bi bi-arrow-right"></i>
                    </button> -->
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

        </div>
        <div class="right-container">
            <span class="resp-fof-logo">
                <img src="assets/logo/fof-logo.png" alt="">
            </span>
            <span class="white-36-500">Sign in to your account</span>
            <span class="grey-white-12-400">Don't have an account?
                <span class="white-12-400">Sign Up</span>
            </span>
            <form action="" [formGroup]="loginForm">
                <div class="input-grp">
                    <label class="white-14-400">Email</label>
                    <input type="text" class="input"
                        [class.invalid]="loginForm.get('email')?.invalid || loginForm.get('email')?.dirty || loginForm.get('email')?.touched"
                        formControlName="email">
                </div>
                <div class="input-grp">
                    <label class="white-14-400">Password</label>
                    <div class="input pass-div">
                        <input [type]="showPassword ? 'text' : 'password'" class="input pass-input"
                            formControlName="password">
                        <div class="pass-icon">
                            <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'"
                                (click)="togglePassVisibility()">
                            </i>
                        </div>
                    </div>
                </div>
                <button class="primary-btn" (click)="onSubmit()">
                    <span class="login-btn-text">Login</span>
                </button>
            </form>
        </div>
    </div>
</div>
